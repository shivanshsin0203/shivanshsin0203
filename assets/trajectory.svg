<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8296ff"/>
      <stop offset="1" stop-color="#3fd99b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="880" height="190" rx="16" fill="#0d1117"/>
  <text x="40" y="42" fill="#7c9cb8" font-size="13" letter-spacing="3" font-family="monospace">// MY TRAJECTORY — full-stack today, AI engineer in progress</text>

  <!-- track + animated progress line -->
  <line x1="110" y1="104" x2="770" y2="104" stroke="#232b39" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="104" x2="770" y2="104" stroke="url(#line)" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="660" stroke-dashoffset="660">
    <animate attributeName="stroke-dashoffset" from="660" to="0" begin="0.3s" dur="2.4s"
             calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
  </line>

  <!-- traveling comet -->
  <circle cx="110" cy="104" r="5" fill="#eafff6" filter="url(#glow)">
    <animate attributeName="cx" from="110" to="770" begin="0.3s" dur="2.4s"
             calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
  </circle>

  <!-- nodes: empty base + accent overlay that lights up in sequence -->
  <g stroke-width="2">
    <circle cx="110" cy="104" r="8" fill="#0d1117" stroke="#232b39"/>
    <circle cx="330" cy="104" r="8" fill="#0d1117" stroke="#232b39"/>
    <circle cx="550" cy="104" r="8" fill="#0d1117" stroke="#232b39"/>
    <circle cx="770" cy="104" r="8" fill="#0d1117" stroke="#232b39"/>
  </g>
  <g>
    <circle cx="110" cy="104" r="8" fill="#3fd99b" opacity="0"><animate attributeName="opacity" to="1" begin="0.5s" dur="0.4s" fill="freeze"/></circle>
    <circle cx="330" cy="104" r="8" fill="#3fd99b" opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" dur="0.4s" fill="freeze"/></circle>
    <circle cx="550" cy="104" r="8" fill="#3fd99b" opacity="0"><animate attributeName="opacity" to="1" begin="1.9s" dur="0.4s" fill="freeze"/></circle>
    <circle cx="770" cy="104" r="9" fill="#8296ff" opacity="0"><animate attributeName="opacity" to="1" begin="2.6s" dur="0.4s" fill="freeze"/></circle>
  </g>
  <!-- destination radar pulse (loops forever) -->
  <circle cx="770" cy="104" r="9" fill="none" stroke="#8296ff" stroke-width="2" opacity="0">
    <animate attributeName="r" from="9" to="22" begin="3s" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.9" to="0" begin="3s" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- labels, faded in with their nodes -->
  <g text-anchor="middle" font-family="monospace">
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
      <text x="110" y="146" fill="#ecede7" font-size="16" font-weight="700">Full-stack</text>
      <text x="110" y="166" fill="#7c9cb8" font-size="12">websites, shipped</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
      <text x="330" y="146" fill="#ecede7" font-size="16" font-weight="700">RAG</text>
      <text x="330" y="166" fill="#7c9cb8" font-size="12">learning</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.1s" dur="0.4s" fill="freeze"/>
      <text x="550" y="146" fill="#ecede7" font-size="16" font-weight="700">Vector DBs</text>
      <text x="550" y="166" fill="#7c9cb8" font-size="12">wiring in</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.8s" dur="0.4s" fill="freeze"/>
      <text x="770" y="146" fill="#8296ff" font-size="16" font-weight="800">AI Engineer</text>
      <text x="770" y="166" fill="#9dadff" font-size="12">in progress &#8594;</text>
    </g>
  </g>
</svg>
