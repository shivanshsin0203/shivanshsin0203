<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b94a0"/>
      <stop offset="0.25" stop-color="#3fd99b"/>
      <stop offset="0.5" stop-color="#4fd1c5"/>
      <stop offset="0.75" stop-color="#8296ff"/>
      <stop offset="1" stop-color="#b794f6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="200" rx="16" fill="#0d1117"/>
  <text x="40" y="42" fill="#7c9cb8" font-size="13" letter-spacing="3" font-family="monospace">// MY TRAJECTORY — full-stack today, AI engineer in progress</text>

  <!-- track + animated progress line (cinematic 3.6s draw) -->
  <line x1="110" y1="108" x2="870" y2="108" stroke="#232b39" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="108" x2="870" y2="108" stroke="url(#line)" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="760" stroke-dashoffset="760">
    <animate attributeName="stroke-dashoffset" from="760" to="0" begin="0.3s" dur="3.6s"
             calcMode="spline" keySplines="0.45 0 0.15 1" fill="freeze"/>
  </line>

  <!-- traveling comet -->
  <circle cx="110" cy="108" r="5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" from="110" to="870" begin="0.3s" dur="3.6s"
             calcMode="spline" keySplines="0.45 0 0.15 1" fill="freeze"/>
  </circle>

  <!-- base nodes -->
  <g stroke-width="2" fill="#0d1117" stroke="#232b39">
    <circle cx="110" cy="108" r="8"/><circle cx="300" cy="108" r="8"/><circle cx="490" cy="108" r="8"/>
    <circle cx="680" cy="108" r="8"/><circle cx="870" cy="108" r="9"/>
  </g>
  <!-- lit nodes, in sequence, spectrum colors -->
  <circle cx="110" cy="108" r="8" fill="#8b94a0" opacity="0"><animate attributeName="opacity" to="1" begin="0.7s" dur="0.4s" fill="freeze"/></circle>
  <circle cx="300" cy="108" r="8" fill="#3fd99b" opacity="0"><animate attributeName="opacity" to="1" begin="1.5s" dur="0.4s" fill="freeze"/></circle>
  <circle cx="490" cy="108" r="8" fill="#4fd1c5" opacity="0"><animate attributeName="opacity" to="1" begin="2.3s" dur="0.4s" fill="freeze"/></circle>
  <circle cx="680" cy="108" r="8" fill="#8296ff" opacity="0"><animate attributeName="opacity" to="1" begin="3.1s" dur="0.4s" fill="freeze"/></circle>
  <circle cx="870" cy="108" r="9" fill="#b794f6" opacity="0"><animate attributeName="opacity" to="1" begin="3.9s" dur="0.4s" fill="freeze"/></circle>
  <!-- destination radar pulse -->
  <circle cx="870" cy="108" r="9" fill="none" stroke="#b794f6" stroke-width="2" opacity="0">
    <animate attributeName="r" from="9" to="24" begin="4.3s" dur="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.9" to="0" begin="4.3s" dur="1.9s" repeatCount="indefinite"/>
  </circle>

  <!-- labels -->
  <g text-anchor="middle" font-family="monospace">
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
      <text x="110" y="150" fill="#ecede7" font-size="15" font-weight="700">Full-stack</text>
      <text x="110" y="170" fill="#7c9cb8" font-size="11">websites, shipped</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.7s" dur="0.4s" fill="freeze"/>
      <text x="300" y="150" fill="#ecede7" font-size="15" font-weight="700">LLM apps</text>
      <text x="300" y="170" fill="#7c9cb8" font-size="11">shipping</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.5s" dur="0.4s" fill="freeze"/>
      <text x="490" y="150" fill="#ecede7" font-size="15" font-weight="700">RAG + Vector DBs</text>
      <text x="490" y="170" fill="#7c9cb8" font-size="11">learning</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="3.3s" dur="0.4s" fill="freeze"/>
      <text x="680" y="150" fill="#ecede7" font-size="15" font-weight="700">AI Agents</text>
      <text x="680" y="170" fill="#7c9cb8" font-size="11">exploring</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="4.1s" dur="0.4s" fill="freeze"/>
      <text x="870" y="150" fill="#b794f6" font-size="15" font-weight="800">AI Engineer</text>
      <text x="870" y="170" fill="#c3aef7" font-size="11">in progress &#8594;</text>
    </g>
  </g>
</svg>
