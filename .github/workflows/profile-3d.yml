name: 3D Contribution

on:
  # rebuild once a day
  schedule:
    - cron: "0 3 * * *"
  # run it by hand
  workflow_dispatch:
  # and whenever main changes
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate the 3D isometric contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

      - name: Publish the SVGs to the 3d-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B 3d-output
          git add -f profile-3d-contrib
          git commit -m "update 3d contribution graphs" || echo "no changes"
          git push -f origin 3d-output
